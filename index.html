<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no: kein Doppeltipp-Zoom, kein Pinch,
         Vollflaeche bis unter die Notch. Pflicht fuer ein Touch-Spiel. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />

    <!-- Diese Datei nie aus dem Cache nehmen.

         Die JS- und CSS-Dateien tragen einen Inhalts-Hash im Namen und duerfen
         deshalb beliebig lange gecacht werden. Die index.html darf das NICHT:
         Sie ist die einzige Stelle, die auf die neuen Hashes verweist. Liegt
         sie im Cache, laedt das Geraet weiter die alten Dateien - der Deploy
         ist draussen und kommt trotzdem nicht an.

         Genau das ist passiert: Auf dem iPhone lief v0.1.0 weiter, waehrend
         lokal laengst korrigiert war, und vier Fehlersuchrunden liefen gegen
         einen Stand, den das Geraet nie geladen hat. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="isiHunt" />
    <meta
      name="description"
      content="isiHunt - jage und sammle leuchtende Relikte in farbenfrohen Fantasy-Welten."
    />

    <!-- Als installierte App laeuft das Spiel ohne Adressleiste. Auf dem iPhone
         ist das der EINZIGE Weg zum Vollbild - Safari kennt dort keine
         Fullscreen-API (siehe src/core/display.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS liest das Manifest nicht, sondern ausschliesslich diesen Verweis. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>isiHunt</title>
    <style>
      /* Randfarben der aktuellen Welt. Gesetzt von `createWorldBackdrop`
         (src/ui/widgets.ts) bei jedem Szenenaufbau; die Vorgabe gilt, solange
         noch keine Welt geladen ist. */
      :root {
        --world-top: #0b1020;
        --world-bottom: #0b1020;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        /* Fallback fuer aeltere Browser; dvh gewinnt direkt darunter. */
        height: 100%;
        overflow: hidden;

        /* Der Verlauf fuellt die Streifen oben und unten, die das Spielfeld
           freilaesst - es ist 9:16, moderne Handys sind schmaler. Oben trifft
           er die obere, unten die untere Verlaufsfarbe der Welt, sodass die
           Naht zum Spielfeld verschwindet.

           Vorher standen dort harte schwarze Balken neben einem farbigen
           Verlauf. */
        background: linear-gradient(
          to bottom,
          var(--world-top) 0%,
          var(--world-top) 30%,
          var(--world-bottom) 70%,
          var(--world-bottom) 100%
        );
        transition: background 400ms ease;
        /* Kein Scroll-Bounce / Pull-to-Refresh waehrend des Spielens. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
      }

      /* Eigenstaendige Hintergrundschicht fuer die Safe Areas.

         Auf iOS kann der Bereich unter dem Home-Indikator ausserhalb des
         Canvas liegen. Die Seite selbst wird dort je nach Standalone-Modus
         nicht immer als Hintergrundflaeche behandelt und kann weiss
         durchscheinen. Diese feste Schicht liegt hinter dem Spiel und fuellt
         deshalb oben und unten garantiert denselben Weltverlauf. */
      #page-backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.16) 0 1px, transparent 1.5px),
          radial-gradient(circle at 72% 74%, rgba(255, 255, 255, 0.1) 0 1px, transparent 1.5px),
          linear-gradient(
            to bottom,
            var(--world-top) 0%,
            var(--world-top) 30%,
            var(--world-bottom) 70%,
            var(--world-bottom) 100%
          );
        background-size: 180px 220px, 260px 300px, auto;
        background-position: 0 0, 40px 80px, 0 0;
        transition: background 400ms ease;
      }

      /* Subtiler Nebel in den Safe Areas: Die Streifen gehoeren optisch zur
         Welt und wirken nicht mehr wie leere Restflaeche neben dem Canvas. */
      #page-backdrop::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 42%,
          rgba(255, 255, 255, 0.08),
          transparent 52%
        );
        opacity: 0.55;
      }

      /* Das Spielfeld haelt sich aus den sicheren Raendern heraus.

         `viewport-fit=cover` laesst die Seite bis unter Dynamic Island und
         Home-Indicator reichen - der Hintergrund soll ja durchgehen. Der
         Canvas darf das aber nicht: Auf einem iPhone 16 Pro verschwand der
         Zurueck-Knopf (Spiel-y 30..90) hinter der Island.

         Deshalb bekommt der Container ein Padding in Hoehe der sicheren
         Raender. Der Hintergrund bleibt randlos, das Spielfeld rutscht
         hinein - genau so weit, wie das Geraet es verlangt.

         Warum nicht am `body`: Dessen Hoehe ist `100dvh`; ein Padding dort
         wuerde die Seite ueber den Bildschirm hinaus wachsen lassen. `#game`
         rechnet mit `border-box` und bleibt dadurch in der Hoehe. */
      #game {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        position: relative;
        z-index: 1;
        /* Auch der Container selbst traegt den Weltverlauf. Auf iOS kann
           eine feste Hintergrundschicht hinter einem gepaddeten Element in
           der unteren Safe Area sonst weiss durchscheinen. */
        background: linear-gradient(
          to bottom,
          var(--world-top) 0%,
          var(--world-top) 30%,
          var(--world-bottom) 70%,
          var(--world-bottom) 100%
        );
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      /* `dvh` = dynamische Viewport-Hoehe: waechst und schrumpft mit Safaris
         ein- und ausklappender Adressleiste. `100%` bzw. `100vh` meinen dort
         die Hoehe MIT ausgeblendeter Leiste - die Seite ist dann hoeher als
         das Sichtbare, der zentrierte Canvas rutscht nach unten und alle
         Trefferflaechen liegen neben dem, was man sieht. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
      }

      /* WebKit-Sonderfall fuer installierte Home-Screen-Apps:
         Bei `viewport-fit=cover` kann `100dvh` die untere Safe Area
         faelschlich abziehen. Der dann entstehende Bereich liegt ausserhalb
         der Web-Seite und kann von Canvas, #game oder #page-backdrop nicht
         eingefaerbt werden. Im Standalone-Modus ist `100vh` die belastbare
         Umgehung, weil es die Safe Area mitnimmt. */
      @media (display-mode: standalone) {
        html,
        body {
          height: 100vh;
          min-height: 100vh;
        }
      }

      html.standalone-app,
      html.standalone-app body {
        height: 100vh;
        min-height: 100vh;
      }

      #game canvas {
        display: block;
      }

      /* Messpunkte fuer die sicheren Raender - unsichtbar, siehe <body>. */
      .safe-probe {
        position: fixed;
        left: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }
      #safe-top {
        top: env(safe-area-inset-top, 0px);
      }
      #safe-bottom {
        bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Versionsnummer unten rechts, ausserhalb des Canvas.

         Bewusst im DOM und nicht nur im Spiel gezeichnet: Wenn Phaser gar
         nicht erst startet, ist sie trotzdem da - und beim Test auf dem Handy
         beantwortet sie ohne Umweg, welcher Stand geladen wurde. */
      #version {
        position: fixed;
        right: calc(env(safe-area-inset-right, 0px) + 6px);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);
        z-index: 10;
        pointer-events: none;
        color: #9aa3bd;
        opacity: 0.55;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      /* Wird von main.ts entfernt, sobald Phaser bootet. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        color: #ffd479;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        font-size: 14px;
      }

      /* iOS Safari bietet fuer normale Webseiten keine Orientierungs-Sperre.
         Wenn der Benutzer das Handy trotzdem quer haelt, bleibt das Spiel
         unsichtbar und erklaert den Zustand, statt ein seitlich unbedienbares
         Spielfeld zu zeigen. Installierte PWAs werden ueber das Manifest
         bereits auf Hochformat festgelegt. */
      #orientation-lock {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        place-items: center;
        padding: 32px;
        box-sizing: border-box;
        color: #f5f1e8;
        background: #0b1020;
        text-align: center;
        font-size: 18px;
        line-height: 1.45;
      }

      #orientation-lock span {
        display: block;
        max-width: 320px;
      }

      @media (orientation: landscape) and (pointer: coarse) {
        #orientation-lock {
          display: grid;
        }

        #game,
        #version,
        #boot {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="page-backdrop" aria-hidden="true"></div>
    <div id="game"></div>
    <div id="orientation-lock" aria-live="polite">
      <span>Bitte halte das Handy hochkant, um isiHunt zu spielen.</span>
    </div>
    <!-- Zwei Messpunkte fuer die sicheren Raender.
         `env(safe-area-inset-*)` laesst sich aus JavaScript nicht direkt lesen.
         Diese beiden 1-Pixel-Marken stehen genau auf der Grenze; ihre Position
         verraet die Werte. Nur so kommen echte Zahlen in den
         Wartungsbildschirm - ein Browser-Simulator kennt keine Notch. -->
    <div class="safe-probe" id="safe-top"></div>
    <div class="safe-probe" id="safe-bottom"></div>
    <div id="boot">isiHunt wird geladen …</div>
    <!-- Version, sobald das Spiel bootet. Steht ausserhalb des Canvas, damit
         sie auch dann sichtbar ist, wenn Phaser gar nicht erst startet. -->
    <div id="version"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
