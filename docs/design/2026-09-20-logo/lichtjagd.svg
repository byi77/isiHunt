  <path d="M90 255 C260 215 365 210 520 220 S830 260 1035 128" fill="none" stroke="url(#trail)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="1040" cy="121" r="19" fill="#fff7cf" stroke="#ffd479" stroke-width="7" filter="url(#glow)"/>
  <path d="M1040 78v-28M1040 164v28M997 121h-28M1083 121h28" stroke="#ffd479" stroke-width="6" stroke-linecap="round"/>
  <text x="74" y="224" fill="url(#word)" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="168" font-weight="700" letter-spacing="-8">isi</text>
  <text x="300" y="224" fill="#ffd479" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="168" font-weight="700" letter-spacing="-8">Hunt</text>
  <path d="M78 258 H905" stroke="#344753" stroke-width="3"/>
  <text x="82" y="302" fill="#b8c0d9" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="29" letter-spacing="9">JAGE DAS LICHT</text>
