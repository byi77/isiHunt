<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">isiHunt — Lichtjagd</title>
  <desc id="desc">Helle Wortmarke mit goldenem Lichtpunkt und kurzer Spur</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e8"/>
      <stop offset="0.55" stop-color="#fff7cf"/>
      <stop offset="1" stop-color="#ffd479"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd479" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffd479" stop-opacity=".78"/>
      <stop offset="1" stop-color="#fff7cf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
