name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt manuelles Ausloesen im Actions-Tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deployment zur Zeit; laufende werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Dieselben Pruefungen wie die CI, hier aber als Sperre vor dem Deploy.
      #
      # Vorher lief der Deploy auch bei roter CI durch - beide Workflows starten
      # unabhaengig voneinander auf denselben Push. Ein Stand mit rotem
      # `format:check` ging so live, ohne dass es jemandem auffiel.
      - name: Pruefen (blockiert den Deploy bei Fehlern)
        run: npm run verify

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Steht im Actions-Log und in der Zusammenfassung des Laufs. Damit laesst
      # sich spaeter nachlesen, welche Version dieser Deploy ausgeliefert hat -
      # ohne das Bundle vom Server holen zu muessen.
      - name: Ausgelieferte Version protokollieren
        run: |
          version=$(node -p "require('./package.json').version")
          echo "Ausgeliefert: v$version"
          echo "### isiHunt v$version ausgeliefert" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pruefen mit \`npm run deploy:check\` oder auf dem Geraet unten rechts." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
