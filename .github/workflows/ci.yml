name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Nur der neueste Lauf je Branch - aeltere werden abgebrochen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Typen pruefen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatierung pruefen
        run: npm run format:check

      - name: Build
        run: npm run build
