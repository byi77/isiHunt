name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Nur der neueste Lauf je Branch - aeltere werden abgebrochen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Typecheck, Lint, Format, Gates, Tests, Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Zwei Commits, damit die Version gegen ihren Vorgaenger geprueft
          # werden kann (siehe Schritt "Versionssprung pruefen").
          fetch-depth: 2

      # Node 24, nicht 20: `jsdom` (Testumgebung) verlangt
      # ^22.22.2 || ^24.15.0 || >=26, sein `undici` mindestens 22.19. Unter
      # Node 20 bricht der Testlauf mit "markAsUncloneable is not a function"
      # ab - lokal lief dieselbe Suite gruen, weil dort Node 24 steht.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Der lokale pre-push-Hook prueft dasselbe - aber nur, wenn er
      # eingerichtet ist und nicht mit --no-verify uebergangen wurde. Hier
      # greift die Pruefung unabhaengig davon.
      #
      # Grund: Ein Deploy, dessen Versionsnummer sich nicht vom Vorgaenger
      # unterscheidet, ist auf dem Geraet nicht ueberpruefbar. Genau daran ist
      # ein kompletter Testabend gescheitert (docs/CODE_STYLE.md 1.9).
      - name: Versionssprung pruefen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          neu=$(node -p "require('./package.json').version")
          alt=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "")

          if [ -z "$alt" ]; then
            echo "Kein Vorgaenger gefunden - Pruefung uebersprungen."
            exit 0
          fi

          echo "Version: $alt -> $neu"

          if [ "$alt" = "$neu" ]; then
            echo "::error::Version unveraendert ($neu). Ein Deploy ohne neue Nummer ist auf dem Geraet nicht von seinem Vorgaenger zu unterscheiden. Siehe docs/CODE_STYLE.md 1.9."
            exit 1
          fi

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Browser fuer Release-Gates installieren
        run: npx playwright install --with-deps chromium

      # `npm run verify` als Ganzes, NICHT die Einzelschritte abgetippt.
      #
      # Vorher standen typecheck, lint, format:check, test und build hier
      # einzeln. Die Liste veraltete still: `balance:inventory` und
      # `scene:guards` kamen spaeter zur verify-Kette dazu und fehlten hier
      # weiterhin - ein Commit mit Inline-Balancewerten oder einem
      # ungeschuetzten Scene-Zugriff bekam eine gruene CI, waehrend derselbe
      # Stand lokal am pre-push-Hook scheiterte (Audit 2026-08-23).
      #
      # Der Deploy-Workflow hat es von Anfang an richtig gemacht. Eine
      # aufgezaehlte Liste veraltet, ein Aufruf der Gesamtkette nicht: Wer
      # `verify` erweitert, erweitert damit automatisch auch die CI.
      - name: Pruefen (dieselbe Kette wie pre-push und Deploy)
        run: npm run verify

      - name: Release-Gates (Browser, Performance, iOS, SQL)
        run: npm run release:check
